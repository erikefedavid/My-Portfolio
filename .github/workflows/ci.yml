name: CI & Codebase Sentinel Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Verify GitSentry Performance Rules
        run: |
          echo "Verifying 60fps composite animation rules and zero AI tells..."
          # Verify zero layout thrashing geometry animations
          ! grep -rn "height: 'auto'" src/ || (echo "Layout thrashing detected" && exit 1)
          ! grep -rn "height: \"auto\"" src/ || (echo "Layout thrashing detected" && exit 1)
          echo "Frontend architectural constraints passed successfully."
